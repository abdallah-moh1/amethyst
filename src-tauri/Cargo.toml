[package]
name = "amethyst"
version = "0.5.7"
description = "Amethyst - A modern markdown note-taking application"
authors = ["Abdallah Mohammad <abdallah.moh.q@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/abdallah-moh1/amethyst.git"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amethyst_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4.33"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = [
    "xdg-portal",
] }
tauri-plugin-os = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
